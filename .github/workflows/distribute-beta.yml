# ── Per-app beta shell (workflows-macos v0.5.3, product-file model) ───────────
# Fires on push to main. The orchestrator discovers Config/products/*.json and
# cuts a beta for each product whose OWN file changed and whose version is still
# unreleased (primary MacPacker → bare v<ver>-beta.N). Channel toggles and the
# Finder/QuickLook extension identity live in the product file; infra only here.
#
# Cross-account (sarensw/MacPacker → LeanBytes/workflows-macos): `secrets: inherit`
# forwards nothing across accounts, so the map stays explicit.
# ─────────────────────────────────────────────────────────────────────────────
name: Distribute Beta

on:
  push:
    branches: [main]

permissions:
  contents: write          # GH pre-release + the auto-pushed beta tag

jobs:
  beta:
    # Make sure the beta job only runs in our own repo, not any fork repo.
    if: github.repository == 'sarensw/MacPacker'
    uses: LeanBytes/workflows-macos/.github/workflows/distribute-beta.yml@v0.5.3
    secrets:
      DEVELOPER_ID_P12_BASE64:        ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:          ${{ secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:              ${{ secrets.KEYCHAIN_PASSWORD }}
      PROV_PROF_DEVID_BASE64:         ${{ secrets.PROV_PROF_DEVID_BASE64 }}
      PROV_PROF_DEVID_FINDER_BASE64:  ${{ secrets.PROV_PROF_DEVID_FINDER_BASE64 }}
      PROV_PROF_DEVID_QL_BASE64:      ${{ secrets.PROV_PROF_DEVID_QL_BASE64 }}
      APPLE_DISTR_P12_BASE64:         ${{ secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:           ${{ secrets.APPLE_DISTR_PASSWORD }}
      MAC_DISTR_P12_BASE64:           ${{ secrets.MAC_DISTR_P12_BASE64 }}
      MAC_DISTR_PASSWORD:             ${{ secrets.MAC_DISTR_PASSWORD }}
      PROV_PROF_STORE_BASE64:         ${{ secrets.PROV_PROF_STORE_BASE64 }}
      PROV_PROF_STORE_FINDER_BASE64:  ${{ secrets.PROV_PROF_STORE_FINDER_BASE64 }}
      PROV_PROF_STORE_QL_BASE64:      ${{ secrets.PROV_PROF_STORE_QL_BASE64 }}
      ASC_KEY_ID:                     ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                  ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:                 ${{ secrets.ASC_KEY_BASE64 }}
      AWS_ACCESS_KEY_ID:              ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:          ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SPARKLE_ED_PRIVATE_KEY:         ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      # v0.4.x: the beta run-tests gate files a ticket when the suite fails.
      JIRA_API_TOKEN:                 ${{ secrets.JIRA_API_TOKEN }}
      SHARED_WORKFLOWS_TOKEN:         ${{ secrets.SHARED_WORKFLOWS_TOKEN }}
    with:
      # All jobs shall run on GitHub infrastructure, not LeanBytes infrastructure
      runs-on-prepare:      '"macos-26"'
      runs-on-build-direct: '"macos-26"'
      runs-on-build-store:  '"macos-26"'
      runs-on-test:         '"macos-26"'
      runs-on-publish:      '"macos-26"'

      artifact-retention-days: 90   # CI artifacts kept 90 days
      # The store leg MUST archive "Release Store" — the orchestrator default is
      # "Release", which would build the wrong flavor.
      configuration-app-store: Release Store

      # ── Test configuration ──
      run-tests: true
      test-runner: swift
      swift-package-path: Modules
