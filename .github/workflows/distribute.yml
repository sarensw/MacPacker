# ── Per-app distribute shell (workflows-apple v0.6.8, product-file model) ─────
# Fires on push to main. The orchestrator discovers Config/products/*.json and
# builds each product whose OWN file changed and whose version is still
# unreleased: Direct to the Sparkle beta feed (primary MacPacker → bare
# v<ver>-beta.N), App Store to TestFlight. The legs live in the product file;
# infra only here.
#
# Also runs by hand (Actions → Distribute → Run workflow) to re-cut a beta
# when nothing changed since the last one — after a flaky runner, a toolchain
# bump, or to reship the same code. It never overrides "already released": a
# released version needs a new changelog version first.
#
# Cross-account (sarensw/MacPacker → LeanBytes/workflows-apple): `secrets: inherit`
# forwards nothing across accounts, so the map stays explicit.
# ─────────────────────────────────────────────────────────────────────────────
name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write          # GH pre-release + the auto-pushed beta tag
  actions: read            # find the last successful run

jobs:
  distribute:
    # Make sure this job only runs in our own repo, not any fork repo. A manual
    # run from any branch but main would publish that branch as a beta.
    if: github.repository == 'sarensw/MacPacker' && github.ref == 'refs/heads/main'
    uses: LeanBytes/workflows-apple/.github/workflows/distribute.yml@v0.6.8
    secrets:
      DEVELOPER_ID_P12_BASE64:        ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:          ${{ secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:              ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_DISTR_P12_BASE64:         ${{ secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:           ${{ secrets.APPLE_DISTR_PASSWORD }}
      MAC_DISTR_P12_BASE64:           ${{ secrets.MAC_DISTR_P12_BASE64 }}
      MAC_DISTR_PASSWORD:             ${{ secrets.MAC_DISTR_PASSWORD }}
      ASC_KEY_ID:                     ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                  ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:                 ${{ secrets.ASC_KEY_BASE64 }}
      AWS_ACCESS_KEY_ID:              ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:          ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SPARKLE_ED_PRIVATE_KEY:         ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      # The run-tests gate files a ticket when the suite fails.
      JIRA_API_TOKEN:                 ${{ secrets.JIRA_API_TOKEN }}
    with:
      # false on a push (the input does not exist there), true only when the box
      # is ticked on a manual run.
      force: ${{ inputs.force || false }}

      # All jobs shall run on GitHub infrastructure, not LeanBytes infrastructure
      runs-on-prepare:          '"macos-26"'
      runs-on-build-mac-direct: '"macos-26"'
      runs-on-build-mac-store:  '"macos-26"'
      runs-on-test:             '"macos-26"'
      runs-on-publish:          '"macos-26"'

      artifact-retention-days: 90   # test results; build artifacts stay one day on a public repo

      # New Sparkle items download from the GitHub pre-release, not S3, which
      # charges for data out (#387). The appcast stays on S3: SUFeedURL is built
      # into installed apps.
      appcast-downloads-from-github: true

      # ── Test configuration ──
      run-tests: true
      test-runner: swift
      swift-package-path: Modules
      # The Swift tests check their archives against the current 7-Zip (`7zz`);
      # the runner image ships only p7zip 17.05 as `7z`. Installed through the
      # shared pre-build hook, so nothing app-specific lives in workflows-apple.
      pre-build-script: .ci/install-sevenzip.sh
